<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Request a website, automation or custom technology project from MANAV SOLS.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://manavsols.com/request/">
  <link rel="icon" type="image/svg+xml" href="/assets/icon/favicon.svg">
  <title>Request a Service | MANAV SOLS</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="form-page">
    <section class="service-request" aria-labelledby="request-title">
      <h1 id="request-title">Request a Service</h1>
      <p class="form-subtitle">Tell me what you need and I will get back to you.</p>

      <form id="serviceForm">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" autocomplete="name" maxlength="80" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" maxlength="120" required>
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <input type="tel" id="mobile" name="mobile" autocomplete="tel" maxlength="20" required>
        </div>

        <div class="form-group">
          <label for="service">Service Needed</label>
          <select id="service" name="service" required>
            <option value="">Select Service</option>
            <option value="Web Development">Web Development</option>
            <option value="AI & Automation">AI &amp; Automation</option>
            <option value="Technical Solutions">Technical Solutions</option>
            <option value="Custom Project">Custom Project</option>
          </select>
        </div>

        <div class="form-group">
          <label for="budget">Your Budget</label>
          <input type="text" id="budget" name="budget" maxlength="60" placeholder="Example: ₹5000 - ₹20000">
        </div>

        <div class="form-group">
          <label for="description">Project Description</label>
          <textarea id="description" name="description" rows="5" maxlength="2000" placeholder="Explain your idea or project" required></textarea>
        </div>

        <div class="form-actions">
          <button class="btn primary" id="submitRequestBtn" type="submit">Submit Request</button>
          <a class="btn secondary" href="/">Back to MANAV SOLS</a>
        </div>
        <p id="formMessage" class="form-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script type="module" src="/request/request.js"></script>
</body>
</html>
