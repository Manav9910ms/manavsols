<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/icon/favicon.svg">
  <title>Create Account | MANAV SOLS</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>MANAV SOLS</h1>
    <p class="auth-subtitle">Create your account.</p>
    <form id="registerForm" novalidate>
      <div class="auth-form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" autocomplete="name" maxlength="80" required>
      </div>
      <div class="auth-form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="auth-form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="auth-form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required>
      </div>
      <button id="registerBtn" class="btn primary" type="button">Create Account</button>
      <p id="authMessage" class="auth-message" aria-live="polite"></p>
    </form>
    <div class="auth-links">
      <a href="/login/">Already have an account? Login</a>
    </div>
  </main>
  <script type="module" src="/auth.js"></script>
</body>
</html>
