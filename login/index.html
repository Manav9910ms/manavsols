<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/icon/favicon.svg">
  <title>Login | MANAV SOLS</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>MANAV SOLS</h1>
    <p class="auth-subtitle">Sign in to your account.</p>
    <form id="loginForm" novalidate>
      <div class="auth-form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="auth-form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button id="loginBtn" class="btn primary" type="button">Login</button>
      <p id="authMessage" class="auth-message" aria-live="polite"></p>
    </form>
    <div class="auth-links">
      <a href="/register/">Create account</a>
      <button id="resetBtn" class="description-button" type="button">Forgot password?</button>
    </div>
  </main>
  <script type="module" src="/auth.js"></script>
</body>
</html>
