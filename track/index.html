<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track the status of your MANAV SOLS service request using your tracking ID and email.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://manavsols.com/track/">
  <link rel="icon" type="image/svg+xml" href="/assets/icon/favicon.svg">
  <title>Track Request | MANAV SOLS</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="track-page">
    <div class="track-shell">
      <section class="track-card" aria-labelledby="track-title">
        <h1 id="track-title">Track Your Request</h1>
        <p class="track-desc">Enter your tracking ID and email to check the latest status.</p>
        <form id="trackForm" class="track-form">
          <div class="form-group">
            <label for="trackId">Tracking ID</label>
            <input id="trackId" name="trackingId" type="text" placeholder="Example: MS-ABC123XYZ789" autocomplete="off" required>
          </div>
          <div class="form-group">
            <label for="trackEmail">Email</label>
            <input id="trackEmail" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="form-actions">
            <button class="btn primary" id="trackBtn" type="submit">Track Request</button>
            <a class="btn secondary" href="/">Back to MANAV SOLS</a>
          </div>
        </form>
      </section>
      <section id="trackResult" aria-live="polite"></section>
    </div>
  </main>
  <script type="module" src="/track/track.js"></script>
</body>
</html>
